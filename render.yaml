services:
  - type: web
    name: askmypdf-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ask-my-pdf-weld.vercel.app,https://askmypdf.vercel.app
      - key: CHROMA_PATH
        value: /app/data/chroma
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: PORT
        value: 8000
